[project]
name = "agentlab"
version = "0.1.0"
description = "Statistically honest experimentation pipeline for AI agent techniques"
readme = "README.md"
authors = [
    { email = "danielpuri1901@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.61",
    "faker>=40.36.0",
    "httpx>=0.28.1",
    "inspect-ai>=0.3.258",
    "inspect-evals>=0.17.0",
    "jinja2>=3.1.6",
    "litellm>=1.97.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "typer>=0.27.1",
]

[project.scripts]
agentlab = "agentlab.cli:app"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto>=5.2.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
markers = [
    "render: renders a real video via `uvx manim` + ffmpeg (slow, needs a network fetch on first use); excluded by default, run with `-m render`",
]
addopts = "-m 'not render'"

[tool.ruff.lint.flake8-bugbear]
# Typer's own documented pattern is `param: T = typer.Option(...)` /
# `typer.Argument(...)` as the default value; both are effectively immutable
# factories, so exempt them from B008 (function-call-in-default-argument)
# instead of scattering per-line noqa comments across cli.py.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
